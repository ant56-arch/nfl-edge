name: Refit Model Coefficients

# Re-fits every coefficient in game_predictions.py, props_predictions.py, and
# (when CFBD_API_KEY is set) cfb_game_predictions.py against real historical
# outcomes, and validates each fit on held-out seasons. This is intentionally
# separate from weekly-picks.yml: it downloads a decade-plus of play-by-play,
# which is slow and unnecessary to redo on every picks run.
#
# Runs weekly (Tuesday, after Monday Night Football has finished and results
# are final) rather than monthly, so each week's actual outcomes get folded
# into the model that predicts the following week - the previous monthly
# cadence meant most of a season could pass before a week's results actually
# influenced the coefficients being used to pick future games.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 2"  # every Tuesday, 6am ET (5am during EST)

permissions:
  contents: write

# Shares weekly-picks.yml's concurrency group so the two workflows never run
# their jobs at the same time - both commit-and-push to main, and this run
# in particular can take 15-20+ minutes (fetching years of NFL play-by-play
# plus several CFB seasons), long enough to overlap with a picks run that
# starts partway through and pushes its own tracking-data commit first. Two
# workflows racing to push from a main they each checked out earlier is
# exactly a non-fast-forward rejection - see the "Commit updated
# coefficients" step's git pull --rebase for the belt-and-suspenders half of
# this fix (guards against a human pushing directly, or a future workflow
# that isn't in this same concurrency group).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fit + validate game model coefficients
        run: python src/fit_model.py

      - name: Fit + validate props model coefficients
        run: python src/fit_props_model.py

      - name: Fit + validate CFB model coefficients
        continue-on-error: true
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python src/fit_cfb_model.py

      - name: Commit updated coefficients
        run: |
          git config user.name "nfl-edge-bot"
          git config user.email "actions@github.com"
          git add src/models/fitted_coefficients.json src/models/fitted_props_coefficients.json src/models/fitted_cfb_coefficients.json
          git diff --cached --quiet && exit 0
          git commit -m "Refit model coefficients against latest historical data"
          git pull --rebase origin main
          git push
