name: Weekly Picks

# Runs both the NFL and college football pipelines. NFL always runs; the CFB
# steps need the CFBD_API_KEY secret (a free key from
# https://collegefootballdata.com/key) and reuse the existing ODDS_API_KEY
# secret for current-week lines. Every CFB step has continue-on-error: true
# so a missing key or a CFBD hiccup can never break the NFL pipeline or the
# deploy - build_site.py already renders an empty state for a sport with no
# data yet.

on:
  workflow_dispatch:
  schedule:
    # Times are ET converted to UTC assuming EDT (UTC-4); after the fall DST
    # change to EST they land an hour earlier in ET. GitHub often starts
    # scheduled runs late, so the minutes are off the top of the hour, where
    # the queue is busiest. Every run rebuilds both sites; the NFL odds are
    # fetched every run, the CFB odds only on the CFB update runs below
    # (about 3 odds-API credits per sport per fetch, 500 a month).
    # Saturday: 12 PM, 4 PM, 7 PM and 11 PM ET. CFB scores and results only;
    # its lines locked Friday at 9 PM ET (src/moneyline.py lock_times).
    - cron: "5 16,20,23 * * 6"
    - cron: "5 3 * * 0"        # Saturday 11 PM ET (03:05 UTC Sunday)
    # Sunday to Friday at noon ET: the daily CFB update (odds included), and
    # an NFL run an hour before Sunday's early slate.
    - cron: "5 16 * * 0-5"
    # 7:15 PM ET, about an hour before the TNF, SNF and MNF kickoffs. Friday's
    # also takes CFB's last odds before the 9 PM ET lock.
    - cron: "15 23 * * 0-4"
    - cron: "15 23 * * 5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate-and-publish-picks:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data
        id: fetch_data
        run: python src/fetch_data.py

      - name: Fetch injury report
        id: fetch_injuries
        run: python src/fetch_injuries.py

      - name: Build features
        id: build_features
        run: python src/build_features.py

      - name: Build defense personnel value (feeds auto_defense_adjustments)
        id: build_defense_stats
        run: python src/build_defense_stats.py

      - name: Fetch Vegas odds
        id: fetch_odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python src/fetch_odds.py

      - name: Generate game predictions (model + market-blended sharp line)
        id: game_predictions
        run: python src/models/game_predictions.py

      - name: Generate player props
        id: player_props
        run: python src/models/props_predictions.py

      - name: Compare to Vegas
        id: compare_vegas
        run: python src/models/compare_to_vegas.py

      - name: Sanity check output
        id: sanity_check
        run: python src/sanity_checks.py

      - name: Track prediction accuracy
        id: track_results
        run: python src/track_results.py

      - name: Fetch CFB data
        id: fetch_cfb_data
        continue-on-error: true
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python src/fetch_cfb_data.py

      - name: Build CFB features
        id: build_cfb_features
        continue-on-error: true
        run: python src/build_cfb_features.py

      # CFB odds only on the daily noon run and Friday's last one before the
      # 9 PM ET lock (and manual runs); other runs keep the logged lines.
      - name: Fetch CFB odds
        id: fetch_cfb_odds
        if: github.event_name != 'schedule' || github.event.schedule == '5 16 * * 0-5' || github.event.schedule == '15 23 * * 5'
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python src/fetch_cfb_odds.py

      - name: Generate CFB game predictions
        id: cfb_game_predictions
        continue-on-error: true
        run: python src/models/cfb_game_predictions.py

      - name: Compare CFB to Vegas
        id: compare_cfb_vegas
        continue-on-error: true
        run: python src/models/compare_cfb_to_vegas.py

      - name: Track CFB prediction accuracy
        id: track_cfb_results
        continue-on-error: true
        run: python src/track_cfb_results.py

      - name: Commit tracking data
        id: commit_tracking
        if: always() && steps.track_results.outcome == 'success'
        run: |
          git config user.name "nfl-edge-bot"
          git config user.email "actions@github.com"
          git add data/tracking/
          git diff --cached --quiet && exit 0
          git commit -m "Update prediction tracking [skip ci]"
          git pull --rebase origin main
          git push

      - name: Build site
        id: build_site
        run: python src/build_site.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
