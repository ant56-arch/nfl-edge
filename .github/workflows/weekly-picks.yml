name: Weekly NFL Picks

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 2"  # Tuesday 8:00 AM ET - early-week outlook
    - cron: "0 12 * * 5"  # Friday 8:00 AM ET - final pre-weekend picks

jobs:
  generate-and-send-picks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data
        run: python src/fetch_data.py

      - name: Fetch injury report
        run: python src/fetch_injuries.py

      - name: Build features
        run: python src/build_features.py

      - name: Generate game predictions
        run: python src/models/game_predictions.py

      - name: Generate player props
        run: python src/models/props_predictions.py

      - name: Fetch Vegas odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python src/fetch_odds.py

      - name: Compare to Vegas
        run: python src/models/compare_to_vegas.py

      - name: Send email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python src/email_report.py
