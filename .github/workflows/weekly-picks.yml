name: Weekly NFL Picks

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 2"  # Tuesday 8:00 AM ET - early-week outlook
    - cron: "0 12 * * 5"  # Friday 8:00 AM ET - final pre-weekend picks

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate-and-publish-picks:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data
        id: fetch_data
        run: python src/fetch_data.py

      - name: Fetch injury report
        id: fetch_injuries
        run: python src/fetch_injuries.py

      - name: Build features
        id: build_features
        run: python src/build_features.py

      - name: Build defense personnel value (feeds auto_defense_adjustments)
        id: build_defense_stats
        run: python src/build_defense_stats.py

      - name: Fetch Vegas odds
        id: fetch_odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python src/fetch_odds.py

      - name: Generate game predictions (model + market-blended sharp line)
        id: game_predictions
        run: python src/models/game_predictions.py

      - name: Generate player props
        id: player_props
        run: python src/models/props_predictions.py

      - name: Compare to Vegas
        id: compare_vegas
        run: python src/models/compare_to_vegas.py

      - name: Sanity check output
        id: sanity_check
        run: python src/sanity_checks.py

      - name: Track prediction accuracy
        id: track_results
        run: python src/track_results.py

      - name: Commit tracking data
        id: commit_tracking
        if: always() && steps.track_results.outcome == 'success'
        run: |
          git config user.name "nfl-edge-bot"
          git config user.email "actions@github.com"
          git add data/tracking/
          git diff --cached --quiet || git commit -m "Update prediction tracking [skip ci]"
          git push

      - name: Build site
        id: build_site
        run: python src/build_site.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
