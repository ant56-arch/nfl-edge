name: Backfill CFB Top 25

# Seeds data/tracking/cfb_top25_summary.json with Vegas's own closing-line
# record (straight-up and against the spread) for the current AP Top 25
# teams' games since 2024 - see src/backfill_cfb_top25.py for the full
# rationale. Runs weekly (Tuesday, half an hour after refit-model.yml's own
# Tuesday run starts) so both the roster (a new AP poll drops every Tuesday
# in-season) and the game results it covers stay current - the underlying
# NFL backfill (backfill_tracking.py) is a true one-time seed since it
# never needs new games added, but this one's source data changes every
# week, so a fixed snapshot would go stale.

on:
  workflow_dispatch:
  schedule:
    - cron: "30 10 * * 2"  # every Tuesday, 30 minutes after refit-model.yml

permissions:
  contents: write

# Shares weekly-picks.yml's and refit-model.yml's concurrency group so this
# never races either of them for a push to main - see refit-model.yml's
# comment on the same setting for the full story of why that matters.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backfill AP Top 25 Vegas record since 2024
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python src/backfill_cfb_top25.py

      - name: Commit updated summary
        run: |
          git config user.name "nfl-edge-bot"
          git config user.email "actions@github.com"
          git add data/tracking/cfb_top25_summary.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh AP Top 25 Vegas record backfill"
          git pull --rebase origin main
          git push
