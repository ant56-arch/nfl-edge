name: Test Data Fetch

# Manual trigger only, for now — this just validates that fetch_data.py
# can pull from nflverse successfully from GitHub's servers.
on:
  workflow_dispatch:

jobs:
  test-fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run data fetch
        run: python src/fetch_data.py

      - name: Show what we got
        run: |
          echo "--- data/raw contents ---"
          ls -lh data/raw/
